name: CI

on:
  push:
    branches: [master, rewrite]
  # The changesets version pull request only rewrites package.json, CHANGELOG.md and
  # deletes the consumed changeset files. Nothing in it can affect the build, and
  # because github-actions[bot] pushes it, GitHub holds its run behind the manual
  # "approve workflows" prompt. Skipping it keeps that pull request a pure review gate.
  pull_request:
    paths-ignore:
      - 'CHANGELOG.md'
      - 'package.json'
      - '.changeset/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Package
        run: pnpm package
